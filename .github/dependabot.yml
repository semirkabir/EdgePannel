# Dependabot runs security updates only: open-pull-requests-limit: 0 turns off
# routine version-update PRs. The ignore rules below also apply to security updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # maplibre-gl v6 crashes deck.gl's interleaved MapboxOverlay
      # (visgl/deck.gl#10700). Port is staged on wip/maplibre-v6.
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
