<!-- @dsCard group="Status" name="RiskBadge" description="Severity score badge for risk levels. Four levels from low to critical with distinct background tints." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); padding: 20px; margin: 0; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .section-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .factor-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
  .factor-name { font-size: 13px; flex: 1; color: var(--text-secondary); }
  .bar-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
</style>
</head>
<body>
  <div>
    <div class="section-label">All levels</div>
    <div class="row">
      <span class="risk-badge risk-badge--low">12</span>
      <span class="risk-badge risk-badge--med">45</span>
      <span class="risk-badge risk-badge--high">73</span>
      <span class="risk-badge risk-badge--critical">91</span>
    </div>
  </div>
  <div>
    <div class="section-label">Risk factor list</div>
    <div class="factor-row">
      <span class="factor-name">Political Stability</span>
      <div class="bar-track"><div class="bar-fill" style="width:72%;background:#ff9800"></div></div>
      <span class="risk-badge risk-badge--high">72</span>
    </div>
    <div class="factor-row">
      <span class="factor-name">Economic Volatility</span>
      <div class="bar-track"><div class="bar-fill" style="width:45%;background:#ffeb3b"></div></div>
      <span class="risk-badge risk-badge--med">45</span>
    </div>
    <div class="factor-row">
      <span class="factor-name">Military Tension</span>
      <div class="bar-track"><div class="bar-fill" style="width:91%;background:#f44336"></div></div>
      <span class="risk-badge risk-badge--critical">91</span>
    </div>
    <div class="factor-row">
      <span class="factor-name">Food Security</span>
      <div class="bar-track"><div class="bar-fill" style="width:18%;background:#4caf50"></div></div>
      <span class="risk-badge risk-badge--low">18</span>
    </div>
  </div>
</body>
</html>
