openapi: 3.1.0
info:
    title: MarketService API
    version: 1.0.0
paths:
    /api/market/v1/list-market-quotes:
        get:
            tags:
                - MarketService
            summary: ListMarketQuotes
            description: ListMarketQuotes retrieves stock and index quotes.
            operationId: ListMarketQuotes
            parameters:
                - name: symbols
                  in: query
                  description: Ticker symbols to retrieve (e.g., ["AAPL", "^GSPC"]). Empty returns defaults.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListMarketQuotesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/list-crypto-quotes:
        get:
            tags:
                - MarketService
            summary: ListCryptoQuotes
            description: ListCryptoQuotes retrieves cryptocurrency quotes from CoinGecko.
            operationId: ListCryptoQuotes
            parameters:
                - name: ids
                  in: query
                  description: Cryptocurrency IDs to retrieve (CoinGecko IDs). Empty returns defaults.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListCryptoQuotesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/list-commodity-quotes:
        get:
            tags:
                - MarketService
            summary: ListCommodityQuotes
            description: ListCommodityQuotes retrieves commodity price quotes from Yahoo Finance.
            operationId: ListCommodityQuotes
            parameters:
                - name: symbols
                  in: query
                  description: Commodity symbols to retrieve (Yahoo symbols). Empty returns defaults.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListCommodityQuotesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/get-sector-summary:
        get:
            tags:
                - MarketService
            summary: GetSectorSummary
            description: GetSectorSummary retrieves market sector performance data from Finnhub.
            operationId: GetSectorSummary
            parameters:
                - name: period
                  in: query
                  description: Time period for performance calculation (e.g., "1d", "1w", "1m"). Defaults to "1d".
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetSectorSummaryResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/list-stablecoin-markets:
        get:
            tags:
                - MarketService
            summary: ListStablecoinMarkets
            description: ListStablecoinMarkets retrieves stablecoin peg health and market data from CoinGecko.
            operationId: ListStablecoinMarkets
            parameters:
                - name: coins
                  in: query
                  description: CoinGecko IDs to retrieve (e.g. "tether,usd-coin"). Empty returns defaults.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListStablecoinMarketsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/list-etf-flows:
        get:
            tags:
                - MarketService
            summary: ListEtfFlows
            description: ListEtfFlows retrieves BTC spot ETF flow estimates from Yahoo Finance.
            operationId: ListEtfFlows
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListEtfFlowsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/get-country-stock-index:
        get:
            tags:
                - MarketService
            summary: GetCountryStockIndex
            description: GetCountryStockIndex retrieves the primary stock index for a country from Yahoo Finance.
            operationId: GetCountryStockIndex
            parameters:
                - name: country_code
                  in: query
                  description: ISO 3166-1 alpha-2 country code (e.g., "US", "GB", "JP").
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCountryStockIndexResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/list-gulf-quotes:
        get:
            tags:
                - MarketService
            summary: ListGulfQuotes
            description: ListGulfQuotes retrieves Gulf region market quotes (indices, currencies, oil).
            operationId: ListGulfQuotes
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListGulfQuotesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/list-sec-filings:
        get:
            tags:
                - MarketService
            summary: ListSecFilings
            description: ListSecFilings retrieves recent SEC EDGAR filings for a company by ticker.
            operationId: ListSecFilings
            parameters:
                - name: ticker
                  in: query
                  description: Ticker symbol (e.g., "AAPL", "GOOG").
                  required: false
                  schema:
                    type: string
                - name: filing_types
                  in: query
                  description: 'Optional: filter by filing types (e.g., "10-K", "10-Q", "8-K"). Empty returns all.'
                  required: false
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Maximum number of filings to return. Defaults to 20.
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: offset
                  in: query
                  description: Zero-based offset for paged results.
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: sort
                  in: query
                  description: 'Sort order: newest, oldest, or type.'
                  required: false
                  schema:
                    type: string
                - name: search
                  in: query
                  description: Optional search over title, form, accession, issuer, and CIK.
                  required: false
                  schema:
                    type: string
                - name: date_range
                  in: query
                  description: 'Date range: all, 7d, 30d, 90d, or 1y.'
                  required: false
                  schema:
                    type: string
                - name: from_date
                  in: query
                  description: Optional inclusive start date, yyyy-mm-dd.
                  required: false
                  schema:
                    type: string
                - name: to_date
                  in: query
                  description: Optional inclusive end date, yyyy-mm-dd.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListSecFilingsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/get-sec-filing-analysis:
        get:
            tags:
                - MarketService
            summary: GetSecFilingAnalysis
            description: GetSecFilingAnalysis interprets a SEC filing into structured metrics and events.
            operationId: GetSecFilingAnalysis
            parameters:
                - name: ticker
                  in: query
                  description: Optional ticker symbol used to resolve CIK when cik is not provided.
                  required: false
                  schema:
                    type: string
                - name: cik
                  in: query
                  description: SEC Central Index Key. May be padded or unpadded.
                  required: false
                  schema:
                    type: string
                - name: accession_number
                  in: query
                  description: SEC accession number, with or without dashes.
                  required: false
                  schema:
                    type: string
                - name: filing_type
                  in: query
                  description: Filing form type, used when accession lookup is unavailable.
                  required: false
                  schema:
                    type: string
                - name: document_url
                  in: query
                  description: Optional EDGAR document URL from a feed row.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetSecFilingAnalysisResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/list-historical-prices:
        get:
            tags:
                - MarketService
            summary: ListHistoricalPrices
            description: ListHistoricalPrices retrieves historical daily prices for specified symbols.
            operationId: ListHistoricalPrices
            parameters:
                - name: symbols
                  in: query
                  description: Ticker symbols to retrieve (e.g., ["AAPL", "GOOGL"]). Max 20.
                  required: false
                  schema:
                    type: string
                - name: months
                  in: query
                  description: Number of months of history (1-60, default 24).
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListHistoricalPricesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        ListMarketQuotesRequest:
            type: object
            properties:
                symbols:
                    type: array
                    items:
                        type: string
                        description: Ticker symbols to retrieve (e.g., ["AAPL", "^GSPC"]). Empty returns defaults.
            description: ListMarketQuotesRequest specifies which stock/index symbols to retrieve.
        ListMarketQuotesResponse:
            type: object
            properties:
                quotes:
                    type: array
                    items:
                        $ref: '#/components/schemas/MarketQuote'
                finnhubSkipped:
                    type: boolean
                    description: True when the Finnhub API key is not configured and stock quotes were skipped.
                skipReason:
                    type: string
                    description: Human-readable reason when Finnhub was skipped (e.g., "FINNHUB_API_KEY not configured").
                rateLimited:
                    type: boolean
                    description: True when the upstream API rate-limited the request.
            description: ListMarketQuotesResponse contains stock and index quotes.
        MarketQuote:
            type: object
            properties:
                symbol:
                    type: string
                    minLength: 1
                    description: Ticker symbol (e.g., "AAPL", "^GSPC").
                name:
                    type: string
                    description: Human-readable name.
                display:
                    type: string
                    description: Display label.
                price:
                    type: number
                    format: double
                    description: Current price.
                change:
                    type: number
                    format: double
                    description: Percentage change from previous close.
                sparkline:
                    type: array
                    items:
                        type: number
                        format: double
                        description: Sparkline data points (recent price history).
            required:
                - symbol
            description: MarketQuote represents a stock or index quote from Finnhub or Yahoo Finance.
        ListCryptoQuotesRequest:
            type: object
            properties:
                ids:
                    type: array
                    items:
                        type: string
                        description: Cryptocurrency IDs to retrieve (CoinGecko IDs). Empty returns defaults.
            description: ListCryptoQuotesRequest specifies which cryptocurrencies to retrieve.
        ListCryptoQuotesResponse:
            type: object
            properties:
                quotes:
                    type: array
                    items:
                        $ref: '#/components/schemas/CryptoQuote'
            description: ListCryptoQuotesResponse contains cryptocurrency quotes.
        CryptoQuote:
            type: object
            properties:
                name:
                    type: string
                    description: Cryptocurrency name (e.g., "Bitcoin").
                symbol:
                    type: string
                    minLength: 1
                    description: Ticker symbol (e.g., "BTC").
                price:
                    type: number
                    format: double
                    description: Current price in USD.
                change:
                    type: number
                    format: double
                    description: 24-hour percentage change.
                sparkline:
                    type: array
                    items:
                        type: number
                        format: double
                        description: Sparkline data points (recent price history).
            required:
                - symbol
            description: CryptoQuote represents a cryptocurrency quote from CoinGecko.
        ListCommodityQuotesRequest:
            type: object
            properties:
                symbols:
                    type: array
                    items:
                        type: string
                        description: Commodity symbols to retrieve (Yahoo symbols). Empty returns defaults.
            description: ListCommodityQuotesRequest specifies which commodities to retrieve.
        ListCommodityQuotesResponse:
            type: object
            properties:
                quotes:
                    type: array
                    items:
                        $ref: '#/components/schemas/CommodityQuote'
            description: ListCommodityQuotesResponse contains commodity quotes.
        CommodityQuote:
            type: object
            properties:
                symbol:
                    type: string
                    minLength: 1
                    description: Commodity symbol (e.g., "CL=F" for crude oil).
                name:
                    type: string
                    description: Human-readable name.
                display:
                    type: string
                    description: Display label.
                price:
                    type: number
                    format: double
                    description: Current price.
                change:
                    type: number
                    format: double
                    description: Percentage change from previous close.
                sparkline:
                    type: array
                    items:
                        type: number
                        format: double
                        description: Sparkline data points.
            required:
                - symbol
            description: CommodityQuote represents a commodity price quote from Yahoo Finance.
        GetSectorSummaryRequest:
            type: object
            properties:
                period:
                    type: string
                    description: Time period for performance calculation (e.g., "1d", "1w", "1m"). Defaults to "1d".
            description: GetSectorSummaryRequest specifies parameters for retrieving sector performance.
        GetSectorSummaryResponse:
            type: object
            properties:
                sectors:
                    type: array
                    items:
                        $ref: '#/components/schemas/SectorPerformance'
            description: GetSectorSummaryResponse contains sector performance data.
        SectorPerformance:
            type: object
            properties:
                symbol:
                    type: string
                    minLength: 1
                    description: Sector symbol.
                name:
                    type: string
                    description: Sector name.
                change:
                    type: number
                    format: double
                    description: Percentage change over the measured period.
            required:
                - symbol
            description: SectorPerformance represents performance data for a market sector.
        ListStablecoinMarketsRequest:
            type: object
            properties:
                coins:
                    type: array
                    items:
                        type: string
                        description: CoinGecko IDs to retrieve (e.g. "tether,usd-coin"). Empty returns defaults.
            description: ListStablecoinMarketsRequest specifies which stablecoins to retrieve.
        ListStablecoinMarketsResponse:
            type: object
            properties:
                timestamp:
                    type: string
                    description: Timestamp of the data fetch (ISO 8601).
                summary:
                    $ref: '#/components/schemas/StablecoinSummary'
                stablecoins:
                    type: array
                    items:
                        $ref: '#/components/schemas/Stablecoin'
            description: ListStablecoinMarketsResponse contains stablecoin market data.
        StablecoinSummary:
            type: object
            properties:
                totalMarketCap:
                    type: number
                    format: double
                    description: Total market cap across all queried stablecoins.
                totalVolume24h:
                    type: number
                    format: double
                    description: Total 24h volume across all queried stablecoins.
                coinCount:
                    type: integer
                    format: int32
                    description: Number of stablecoins returned.
                depeggedCount:
                    type: integer
                    format: int32
                    description: Number of stablecoins in DEPEGGED state.
                healthStatus:
                    type: string
                    description: 'Overall health: "HEALTHY", "CAUTION", or "WARNING".'
            description: StablecoinSummary contains aggregate stablecoin market stats.
        Stablecoin:
            type: object
            properties:
                id:
                    type: string
                    minLength: 1
                    description: CoinGecko ID.
                symbol:
                    type: string
                    minLength: 1
                    description: Ticker symbol (e.g. "USDT").
                name:
                    type: string
                    description: Human-readable name.
                price:
                    type: number
                    minimum: 0
                    format: double
                    description: Current price in USD.
                deviation:
                    type: number
                    format: double
                    description: Deviation from $1.00 peg, as a percentage.
                pegStatus:
                    type: string
                    description: 'Peg status: "ON PEG", "SLIGHT DEPEG", or "DEPEGGED".'
                marketCap:
                    type: number
                    format: double
                    description: Market capitalization in USD.
                volume24h:
                    type: number
                    format: double
                    description: 24-hour trading volume in USD.
                change24h:
                    type: number
                    format: double
                    description: 24-hour price change percentage.
                change7d:
                    type: number
                    format: double
                    description: 7-day price change percentage.
                image:
                    type: string
                    description: Coin image URL.
            required:
                - id
                - symbol
            description: Stablecoin represents a single stablecoin with peg health data.
        ListEtfFlowsRequest:
            type: object
            description: ListEtfFlowsRequest is empty; the handler uses a fixed list of BTC spot ETFs.
        ListEtfFlowsResponse:
            type: object
            properties:
                timestamp:
                    type: string
                    description: Timestamp of the data fetch (ISO 8601).
                summary:
                    $ref: '#/components/schemas/EtfFlowsSummary'
                etfs:
                    type: array
                    items:
                        $ref: '#/components/schemas/EtfFlow'
                rateLimited:
                    type: boolean
                    description: True when the upstream API rate-limited the request.
            description: ListEtfFlowsResponse contains BTC spot ETF flow data.
        EtfFlowsSummary:
            type: object
            properties:
                etfCount:
                    type: integer
                    format: int32
                    description: Number of ETFs with data.
                totalVolume:
                    type: integer
                    format: int64
                    description: 'Total volume across all ETFs.. Warning: Values > 2^53 may lose precision in JavaScript'
                totalEstFlow:
                    type: integer
                    format: int64
                    description: 'Total estimated flow across all ETFs.. Warning: Values > 2^53 may lose precision in JavaScript'
                netDirection:
                    type: string
                    description: 'Net direction: "NET INFLOW", "NET OUTFLOW", or "NEUTRAL".'
                inflowCount:
                    type: integer
                    format: int32
                    description: Number of ETFs with inflow.
                outflowCount:
                    type: integer
                    format: int32
                    description: Number of ETFs with outflow.
            description: EtfFlowsSummary contains aggregate ETF flow stats.
        EtfFlow:
            type: object
            properties:
                ticker:
                    type: string
                    minLength: 1
                    description: Ticker symbol (e.g. "IBIT").
                issuer:
                    type: string
                    description: Fund issuer (e.g. "BlackRock").
                price:
                    type: number
                    format: double
                    description: Latest closing price.
                priceChange:
                    type: number
                    format: double
                    description: Day-over-day price change percentage.
                volume:
                    type: integer
                    format: int64
                    description: 'Latest daily volume.. Warning: Values > 2^53 may lose precision in JavaScript'
                avgVolume:
                    type: integer
                    format: int64
                    description: 'Average volume over prior days.. Warning: Values > 2^53 may lose precision in JavaScript'
                volumeRatio:
                    type: number
                    format: double
                    description: Volume ratio (latest / average).
                direction:
                    type: string
                    description: 'Flow direction: "inflow", "outflow", or "neutral".'
                estFlow:
                    type: integer
                    format: int64
                    description: 'Estimated dollar flow magnitude.. Warning: Values > 2^53 may lose precision in JavaScript'
            required:
                - ticker
            description: EtfFlow represents a single ETF with estimated flow data.
        GetCountryStockIndexRequest:
            type: object
            properties:
                countryCode:
                    type: string
                    pattern: ^[A-Z]{2}$
                    description: ISO 3166-1 alpha-2 country code (e.g., "US", "GB", "JP").
            required:
                - countryCode
            description: GetCountryStockIndexRequest specifies which country's stock index to retrieve.
        GetCountryStockIndexResponse:
            type: object
            properties:
                available:
                    type: boolean
                    description: Whether stock index data is available for this country.
                code:
                    type: string
                    description: ISO 3166-1 alpha-2 country code.
                symbol:
                    type: string
                    description: Ticker symbol (e.g., "^GSPC").
                indexName:
                    type: string
                    description: Index name (e.g., "S&P 500").
                price:
                    type: number
                    format: double
                    description: Latest closing price.
                weekChangePercent:
                    type: number
                    format: double
                    description: Weekly change percentage.
                currency:
                    type: string
                    description: Currency of the index.
                fetchedAt:
                    type: string
                    description: When the data was fetched (ISO 8601).
            description: GetCountryStockIndexResponse contains the country's primary stock index data.
        ListGulfQuotesRequest:
            type: object
        ListGulfQuotesResponse:
            type: object
            properties:
                quotes:
                    type: array
                    items:
                        $ref: '#/components/schemas/GulfQuote'
                rateLimited:
                    type: boolean
        GulfQuote:
            type: object
            properties:
                symbol:
                    type: string
                name:
                    type: string
                flag:
                    type: string
                country:
                    type: string
                type:
                    type: string
                price:
                    type: number
                    format: double
                change:
                    type: number
                    format: double
                sparkline:
                    type: array
                    items:
                        type: number
                        format: double
            description: GulfQuote represents a Gulf region market quote (index, currency, or oil).
        ListSecFilingsRequest:
            type: object
            properties:
                ticker:
                    type: string
                    description: Ticker symbol (e.g., "AAPL", "GOOG").
                filingTypes:
                    type: array
                    items:
                        type: string
                        description: 'Optional: filter by filing types (e.g., "10-K", "10-Q", "8-K"). Empty returns all.'
                limit:
                    type: integer
                    format: int32
                    description: Maximum number of filings to return. Defaults to 20.
                offset:
                    type: integer
                    format: int32
                    description: Zero-based offset for paged results.
                sort:
                    type: string
                    description: 'Sort order: newest, oldest, or type.'
                search:
                    type: string
                    description: Optional search over title, form, accession, issuer, and CIK.
                dateRange:
                    type: string
                    description: 'Date range: all, 7d, 30d, 90d, or 1y.'
                fromDate:
                    type: string
                    description: Optional inclusive start date, yyyy-mm-dd.
                toDate:
                    type: string
                    description: Optional inclusive end date, yyyy-mm-dd.
            description: ListSecFilingsRequest specifies parameters for retrieving SEC EDGAR filings.
        ListSecFilingsResponse:
            type: object
            properties:
                filings:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecFiling'
                ticker:
                    type: string
                companyName:
                    type: string
                totalCount:
                    type: integer
                    format: int32
                offset:
                    type: integer
                    format: int32
                limit:
                    type: integer
                    format: int32
            description: ListSecFilingsResponse contains SEC EDGAR filings for a company.
        SecFiling:
            type: object
            properties:
                accessionNumber:
                    type: string
                filingType:
                    type: string
                filedAt:
                    type: string
                title:
                    type: string
                url:
                    type: string
                issuerName:
                    type: string
                issuerCik:
                    type: string
            description: SecFiling represents a single SEC EDGAR filing.
        GetSecFilingAnalysisRequest:
            type: object
            properties:
                ticker:
                    type: string
                    description: Optional ticker symbol used to resolve CIK when cik is not provided.
                cik:
                    type: string
                    description: SEC Central Index Key. May be padded or unpadded.
                accessionNumber:
                    type: string
                    description: SEC accession number, with or without dashes.
                filingType:
                    type: string
                    description: Filing form type, used when accession lookup is unavailable.
                documentUrl:
                    type: string
                    description: Optional EDGAR document URL from a feed row.
            description: GetSecFilingAnalysisRequest identifies a SEC filing to interpret.
        GetSecFilingAnalysisResponse:
            type: object
            properties:
                ticker:
                    type: string
                companyName:
                    type: string
                cik:
                    type: string
                accessionNumber:
                    type: string
                filingType:
                    type: string
                formCategory:
                    type: string
                filedAt:
                    type: string
                title:
                    type: string
                url:
                    type: string
                summaryBullets:
                    type: array
                    items:
                        type: string
                metrics:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecFilingMetric'
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecFilingEvent'
                series:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecFilingSeries'
                structured:
                    type: boolean
                fallbackReason:
                    type: string
            description: GetSecFilingAnalysisResponse contains interpreted SEC filing data.
        SecFilingMetric:
            type: object
            properties:
                id:
                    type: string
                label:
                    type: string
                value:
                    type: number
                    format: double
                formattedValue:
                    type: string
                unit:
                    type: string
                kind:
                    type: string
                yoy:
                    type: number
                    format: double
                hasYoy:
                    type: boolean
                fiscalPeriod:
                    type: string
                filedAt:
                    type: string
            description: SecFilingMetric is a normalized number extracted from SEC facts.
        SecFilingEvent:
            type: object
            properties:
                label:
                    type: string
                value:
                    type: string
                kind:
                    type: string
            description: SecFilingEvent is a form-specific disclosure or interpretation.
        SecFilingSeries:
            type: object
            properties:
                id:
                    type: string
                label:
                    type: string
                unit:
                    type: string
                points:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecFilingSeriesPoint'
            description: SecFilingSeries is a visualization-ready series.
        SecFilingSeriesPoint:
            type: object
            properties:
                label:
                    type: string
                value:
                    type: number
                    format: double
                filedAt:
                    type: string
            description: SecFilingSeriesPoint is one chart/table point.
        ListHistoricalPricesRequest:
            type: object
            properties:
                symbols:
                    type: array
                    items:
                        type: string
                        description: Ticker symbols to retrieve (e.g., ["AAPL", "GOOGL"]). Max 20.
                months:
                    type: integer
                    format: int32
                    description: Number of months of history (1-60, default 24).
            description: ListHistoricalPricesRequest specifies symbols and time range for historical prices.
        ListHistoricalPricesResponse:
            type: object
            properties:
                series:
                    type: array
                    items:
                        $ref: '#/components/schemas/PriceSeries'
            description: ListHistoricalPricesResponse contains historical price series for requested symbols.
        PriceSeries:
            type: object
            properties:
                symbol:
                    type: string
                    description: The ticker symbol.
                prices:
                    type: array
                    items:
                        $ref: '#/components/schemas/DailyPrice'
            description: PriceSeries is a time series of daily prices for one symbol.
        DailyPrice:
            type: object
            properties:
                date:
                    type: string
                    description: Date in YYYY-MM-DD format.
                close:
                    type: number
                    format: float
                    description: Closing price.
                volume:
                    type: string
                    format: int64
                    description: Trading volume.
            description: DailyPrice represents a single day's closing price.
