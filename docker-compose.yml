services:
  postgres:
    image: postgres:15-alpine
    container_name: prediction_markets_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edgepannel_network

  redis:
    image: redis:7-alpine
    container_name: prediction_markets_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edgepannel_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  edgepannel_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
