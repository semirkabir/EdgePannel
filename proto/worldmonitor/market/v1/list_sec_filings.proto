syntax = "proto3";

package worldmonitor.market.v1;

import "sebuf/http/annotations.proto";

// ListSecFilingsRequest specifies parameters for retrieving SEC EDGAR filings.
message ListSecFilingsRequest {
  // Ticker symbol (e.g., "AAPL", "GOOG").
  string ticker = 1 [(sebuf.http.query) = { name: "ticker" }];

  // Optional: filter by filing types (e.g., "10-K", "10-Q", "8-K"). Empty returns all.
  repeated string filing_types = 2 [(sebuf.http.query) = { name: "filing_types" }];

  // Maximum number of filings to return. Defaults to 20.
  int32 limit = 3 [(sebuf.http.query) = { name: "limit" }];

  // Zero-based offset for paged results.
  int32 offset = 4 [(sebuf.http.query) = { name: "offset" }];

  // Sort order: newest, oldest, or type.
  string sort = 5 [(sebuf.http.query) = { name: "sort" }];

  // Optional search over title, form, accession, issuer, and CIK.
  string search = 6 [(sebuf.http.query) = { name: "search" }];

  // Date range: all, 7d, 30d, 90d, or 1y.
  string date_range = 7 [(sebuf.http.query) = { name: "date_range" }];

  // Optional inclusive start date, yyyy-mm-dd.
  string from_date = 8 [(sebuf.http.query) = { name: "from_date" }];

  // Optional inclusive end date, yyyy-mm-dd.
  string to_date = 9 [(sebuf.http.query) = { name: "to_date" }];
}

// SecFiling represents a single SEC EDGAR filing.
message SecFiling {
  string accession_number = 1;
  string filing_type = 2;
  string filed_at = 3;
  string title = 4;
  string url = 5;
  string issuer_name = 6;
  string issuer_cik = 7;
}

// ListSecFilingsResponse contains SEC EDGAR filings for a company.
message ListSecFilingsResponse {
  repeated SecFiling filings = 1;
  string ticker = 2;
  string company_name = 3;
  int32 total_count = 4;
  int32 offset = 5;
  int32 limit = 6;
}
